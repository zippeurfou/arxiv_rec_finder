name: arxiv-bot-daily

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          # Wait until Ollama is listing models (server ready)
          until ollama list >/dev/null 2>&1; do
            echo "Waiting for Ollama..."
            sleep 1
          done

      - name: Pull deepseek model
        run: ollama pull deepseek-r1:latest

      - name: Run bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python main.py

      - name: Commit cache updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state/email_cache.jsonl ]; then
            git add state/email_cache.jsonl
            git commit -m "chore: update email cache [skip ci]" || echo "no cache changes"
            git push || echo "nothing to push"
          else
            echo "no cache file to commit"
          fi
